name: Release

# Push a tag like v0.1.0 (matching package.json's version) to build the
# download and open a DRAFT release with it attached. Nothing is published
# until a maintainer reviews the draft and presses Publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to create the draft release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1; }
      - run: npm run typecheck
      - run: npm run build
      - run: npm run qa
      - run: npm run security-test
      - run: node scripts/release/scan-secrets.mjs
      - run: node scripts/release/licenses.mjs
      - name: Build debate-app-<version>.zip
        run: node scripts/release/make-zip.mjs --notes
      - name: Launchers keep their exec bits in the zip
        run: |
          zipinfo release/debate-app-*.zip | grep -E 'Start on (Mac\.command|Linux\.sh)$' | tee /dev/stderr | grep -c '^-rwxr-xr-x' | grep -qx 2
      - uses: actions/upload-artifact@v4
        with:
          name: debate-app-zip
          path: release/debate-app-*.zip
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/debate-app-*.zip --draft --title "The Debate App $GITHUB_REF_NAME" --notes-file release/release-notes.md
