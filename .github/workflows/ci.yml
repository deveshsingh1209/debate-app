name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # Windows has not had a green run yet: it reports, it does not block.
    # Its first run failed in `npm ci` compiling better-sqlite3 (no Visual
    # Studio Build Tools); the app now uses Node's built-in SQLite and the
    # "No native compile" step below proves nothing builds. Remove this line
    # once Windows passes.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        include:
          # The oldest supported Node (engines): first with node:sqlite unflagged,
          # and one that prints the ExperimentalWarning server/src/sqlite.ts drops.
          - os: ubuntu-latest
            node: 22.13.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Installing must need no compiler (node-gyp, Visual Studio, Xcode tools, build-essential).
      - name: No native compile
        run: node scripts/ci/no-native-build.mjs
      - run: npm run typecheck
      - run: npm run build
      # Linux and macOS: the full suite. Windows: the same suites minus the
      # POSIX-only ones (each named, with the reason, in scripts/ci/qa.mjs).
      - run: npm run qa
        if: runner.os != 'Windows'
      - run: node scripts/ci/qa.mjs
        if: runner.os == 'Windows'
      # Boots servers and checks POSIX sandbox and file-mode rules; Linux and macOS only.
      - run: npm run security-test
        if: runner.os != 'Windows'

  hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secrets and personal data (tracked files)
        run: node scripts/release/scan-secrets.mjs
      - name: Production licences
        run: node scripts/release/licenses.mjs
      - name: Known vulnerabilities
        run: npm audit --audit-level=moderate
